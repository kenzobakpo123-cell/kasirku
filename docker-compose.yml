services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kasirku}
      MYSQL_USER: ${MYSQL_USER:-kasirku}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-kasirku-rahasia}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-kasirku-root-rahasia}
    ports:
      - "3308:3306"
    volumes:
      - kasirku-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER:-kasirku}", "-p${MYSQL_PASSWORD:-kasirku-rahasia}"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  kasirku-db:
