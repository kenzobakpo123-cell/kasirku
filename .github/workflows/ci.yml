name: CI

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: kasirku
          MYSQL_USER: kasirku
          MYSQL_PASSWORD: kasirku-ci
          MYSQL_ROOT_PASSWORD: root-ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot-ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    env:
      DATABASE_URL: mysql://kasirku:kasirku-ci@127.0.0.1:3306/kasirku
      JWT_SECRET: ci-only-secret-yang-panjang-di-atas-32-karakter
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      RESEND_API_KEY: ""
      EMAIL_FROM: "Kasirku <onboarding@resend.dev>"
      ARCJET_KEY: ""

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm test
      - run: npm run db:migrate
      - run: npm run build
